
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Online Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 26px; }

    .cart-summary {
      background: #facc15;
      color: #172554;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(120deg, #dbeafe, #ede9fe);
    }

    .hero h2 { font-size: 32px; margin-bottom: 10px; }
    .hero p { color: #555; }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px #00000010;
      transition: transform 0.2s;
    }

    .product:hover { transform: translateY(-4px); }

    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #eee;
    }

    .product-info { padding: 18px; }
    .product-info h3 { margin-bottom: 8px; }
    .description { color: #666; font-size: 14px; margin-bottom: 12px; }
    .price { color: #166534; font-size: 21px; font-weight: bold; margin-bottom: 14px; }

    button {
      border: none;
      cursor: pointer;
      border-radius: 6px;
      padding: 11px 14px;
      font-weight: bold;
    }

    .add-btn {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    button:hover { opacity: 0.88; }

    .cart {
      background: white;
      padding: 24px;
      margin-top: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 12px #00000010;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-controls button {
      background: #e5e7eb;
      padding: 6px 11px;
    }

    .remove-btn { background: #fee2e2; color: #b91c1c; }
    .total { text-align: right; font-size: 22px; margin-top: 20px; }
    .checkout {
      display: block;
      margin: 18px 0 0 auto;
      background: #15803d;
      color: white;
      padding: 13px 24px;
    }

    .empty { color: #666; padding: 20px 0; }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 35px;
      background: #172554;
      color: white;
    }

    @media (max-width: 500px) {
      .hero h2 { font-size: 25px; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🛍️ ShopEasy</h1>
    <div class="cart-summary">
      🛒 Cart: <span id="cart-count">0</span>
    </div>
  </header>

  <section class="hero">
    <h2>Welcome to ShopEasy</h2>
    <p>Discover great products at great prices.</p>
  </section>

  <main class="container">
    <h2 class="section-title">Our Products</h2>
    <div class="products" id="products"></div>

    <section class="cart" id="cart">
      <h2>Your Shopping Cart</h2>
      <div id="cart-items"></div>
      <div class="total">
        Total: <strong id="cart-total">₹0.00</strong>
      </div>
      <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
    </section>
  </main>

  <footer>
    <p>© 2026 ShopEasy. Demo e-commerce store.</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "Wireless Headphones",
        description: "Enjoy music with clear sound.",
        price: 1499,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
      },
      {
        id: 2,
        name: "Smart Watch",
        description: "Track your daily activities.",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
      },
      {
        id: 3,
        name: "Running Shoes",
        description: "Comfortable shoes for every day.",
        price: 1999,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
      },
      {
        id: 4,
        name: "Backpack",
        description: "A practical bag for everyday use.",
        price: 999,
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
      }
    ];

    const cart = {};

    const money = amount =>
      new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR"
      }).format(amount);

    function renderProducts() {
      document.getElementById("products").innerHTML = products.map(p => `
        <article class="product">
          <img src="${p.image}" alt="${p.name}"
               onerror="this.style.display='none'">
          <div class="product-info">
            <h3>${p.name}</h3>
            <p class="description">${p.description}</p>
            <p class="price">${money(p.price)}</p>
            <button class="add-btn" onclick="addToCart(${p.id})">
              Add to Cart
            </button>
          </div>
        </article>
      `).join("");
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function changeQuantity(id, amount) {
      cart[id] = (cart[id] || 0) + amount;
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function removeItem(id) {
      delete cart[id];
      renderCart();
    }

    function renderCart() {
      const entries = Object.entries(cart);
      const count = entries.reduce((sum, [, qty]) => sum + qty, 0);
      const total = entries.reduce((sum, [id, qty]) => {
        const product = products.find(p => p.id === Number(id));
        return sum + product.price * qty;
      }, 0);

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent = money(total);

      document.getElementById("cart-items").innerHTML = entries.length
        ? entries.map(([id, qty]) => {
            const p = products.find(item => item.id === Number(id));
            return `
              <div class="cart-item">
                <div>
                  <strong>${p.name}</strong><br>
                  <span>${money(p.price)} each</span>
                </div>
                <div class="quantity-controls">
                  <button onclick="changeQuantity(${p.id}, -1)"
                          aria-label="Decrease quantity">−</button>
                  <span>${qty}</span>
                  <button onclick="changeQuantity(${p.id}, 1)"
                          aria-label="Increase quantity">+</button>
                  <button class="remove-btn"
                          onclick="removeItem(${p.id})">Remove</button>
                </div>
              </div>
            `;
          }).join("")
        : '<p class="empty">Your cart is empty. Add a product to get started!</p>';
    }

    function checkout() {
      const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);

      if (count === 0) {
        alert("Your cart is empty!");
        return;
      }

      const total = products.reduce(
        (sum, p) => sum + p.price * (cart[p.id] || 0), 0
      );

      alert(
        "Demo checkout only!\\n" +
        "Items: " + count + "\\n" +
        "Total: " + money(total) +
        "\\nNo payment has been processed."
      );
    }

    renderProducts();
    renderCart();
  </script>

</body>
</html>
